name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # Generated code is committed so contributors need no toolchain. This
      # gate fails if it drifts from the source of truth.
      - name: Generated code is up to date
        run: python contracts/codegen.py --check
      - name: Mappings reference only registered metrics
        run: python contracts/mapcheck.py

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
        working-directory: backend
      - run: ruff check app tests
        working-directory: backend
      - run: pytest -q
        working-directory: backend
        env:
          DCIM_JWT_SECRET: ci-secret
          DCIM_COLLECTOR_TOKEN: ci-collector-token
          DCIM_CREDENTIAL_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          DCIM_ADMIN_PASSWORD: ci-admin-password

  collector:
    name: Collector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: collector/go.sum
      - run: go mod tidy
        working-directory: collector
      - name: go.mod is tidy
        run: git diff --exit-code go.mod go.sum
        working-directory: collector
      - run: go vet ./...
        working-directory: collector
      - run: go build ./...
        working-directory: collector
      - run: go test ./...
        working-directory: collector

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: dcim
          POSTGRES_PASSWORD: dcim
          POSTGRES_DB: dcim
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dcim" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
        working-directory: backend
      - name: alembic upgrade head
        run: alembic upgrade head
        working-directory: backend
        env:
          DCIM_DATABASE_URL: postgresql+asyncpg://dcim:dcim@localhost:5432/dcim
          DCIM_JWT_SECRET: ci-secret
          DCIM_COLLECTOR_TOKEN: ci-collector-token
          DCIM_CREDENTIAL_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      # A migration that cannot be rolled back is a migration you cannot deploy
      # on a Friday.
      - name: alembic downgrade base
        run: alembic downgrade base
        working-directory: backend
        env:
          DCIM_DATABASE_URL: postgresql+asyncpg://dcim:dcim@localhost:5432/dcim
          DCIM_JWT_SECRET: ci-secret
          DCIM_COLLECTOR_TOKEN: ci-collector-token
          DCIM_CREDENTIAL_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
