name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # Generated code is committed so contributors need no toolchain. This
      # gate fails if it drifts from the source of truth.
      - name: Generated code is up to date
        run: python contracts/codegen.py --check
      - name: Mappings reference only registered metrics
        run: python contracts/mapcheck.py

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
        working-directory: backend
      - run: ruff check app tests
        working-directory: backend
      - run: pytest -q
        working-directory: backend
        env:
          DCIM_JWT_SECRET: ci-secret
          DCIM_COLLECTOR_TOKEN: ci-collector-token
          DCIM_CREDENTIAL_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          DCIM_ADMIN_PASSWORD: ci-admin-password

  collector:
    name: Collector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: collector/go.sum
      - run: go mod tidy
        working-directory: collector
      - name: go.mod is tidy
        run: git diff --exit-code go.mod go.sum
        working-directory: collector
      - name: gofmt
        run: test -z "$(gofmt -l .)"
        working-directory: collector
      - run: go vet ./...
        working-directory: collector
      - run: go build ./...
        working-directory: collector
      - run: go test ./...
        working-directory: collector

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # The chart ramps are colour, and colour is the one thing a reviewer
      # cannot check by reading a diff. This measures them: CIEDE2000 between
      # every pair of series tokens, under normal vision and under each of the
      # three dichromacies, plus contrast against the panel they are drawn on.
      - run: node scripts/validate_palette.js
      - run: npm run build
        working-directory: frontend

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: dcim
          POSTGRES_PASSWORD: dcim
          POSTGRES_DB: dcim
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dcim" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
        working-directory: backend
      - name: alembic upgrade head
        run: alembic upgrade head
        working-directory: backend
        env:
          DCIM_DATABASE_URL: postgresql+asyncpg://dcim:dcim@localhost:5432/dcim
          DCIM_JWT_SECRET: ci-secret
          DCIM_COLLECTOR_TOKEN: ci-collector-token
          DCIM_CREDENTIAL_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      # The whole Jira loop over real HTTP against this database: a real
      # alarm row, the real outbox, the real dispatcher, a Jira answering on a
      # socket, a real signature, the real inbox applier. It runs HERE rather
      # than in the Backend job because it is the only job with a database.
      - name: jira integration loop
        run: pytest -q tests/test_jira_end_to_end.py
        working-directory: backend
        env:
          DCIM_TEST_DATABASE_URL: postgresql+asyncpg://dcim:dcim@localhost:5432/dcim
          DCIM_DATABASE_URL: postgresql+asyncpg://dcim:dcim@localhost:5432/dcim
          DCIM_JWT_SECRET: ci-secret
          DCIM_COLLECTOR_TOKEN: ci-collector-token
          DCIM_CREDENTIAL_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          DCIM_PUBLIC_BASE_URL: https://dcim.ci.test

      # A migration that cannot be rolled back is a migration you cannot deploy
      # on a Friday.
      - name: alembic downgrade base
        run: alembic downgrade base
        working-directory: backend
        env:
          DCIM_DATABASE_URL: postgresql+asyncpg://dcim:dcim@localhost:5432/dcim
          DCIM_JWT_SECRET: ci-secret
          DCIM_COLLECTOR_TOKEN: ci-collector-token
          DCIM_CREDENTIAL_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
