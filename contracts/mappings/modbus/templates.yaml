# Modbus register templates. GENERATED - edit gen_modbus_templates.py.
#
# Modbus has no discovery. Nothing on the wire says what address 0x0020
# means, what scale applies, or which way round a 32-bit value is stored,
# so a template per model is the entire integration - exactly as it is on
# a real site.
#
# Keyed by MAP ID, which FC43 (Read Device Identification) serves back, so
# the adapter can check at first contact that the template it is about to
# decode with belongs to the device answering. Pointing the wrong template
# at a device does not fail: it returns numbers.
#
# scale  divides the raw register to give the VENDOR's unit
# factor multiplies the vendor's unit to give the REGISTRY's unit
#
# word_order is per template because it is per vendor. Decoding an Eaton
# map with Schneider word order yields energy off by a factor of 65536,
# which is the most common Modbus integration bug there is.
version: 1

templates:

  SIM-ASCO7000-v1:
    vendor: "ASCO Power Technologies"
    product: "7000 Series ATS"
    word_order: big
    device_types: [ats]
    points:
      - { space: input, addr: 0x0000, name: Normal_Voltage, dtype: u16, scale: 10, metric: voltage_ll, instance: NORMAL }
      - { space: input, addr: 0x0001, name: Emergency_Voltage, dtype: u16, scale: 10, metric: voltage_ll, instance: EMERGENCY }
      - { space: input, addr: 0x0002, name: Active_Frequency, dtype: u16, scale: 10, metric: line_frequency, instance: ACTIVE }
      - { space: input, addr: 0x0003, name: Normal_Frequency, dtype: u16, scale: 10, metric: line_frequency, instance: NORMAL }
      - { space: input, addr: 0x0004, name: Emergency_Frequency, dtype: u16, scale: 10, metric: line_frequency, instance: EMERGENCY }
      - { space: input, addr: 0x0030, name: Transfer_Count, dtype: u32, metric: transfer_count }
      - { space: input, addr: 0x0032, name: Time_On_Emergency, dtype: u32, metric: time_on_emergency }
      - { space: holding, addr: 0x0100, name: Switch_Position, dtype: u16, metric: operating_mode, enum: { 0: "none", 1: "normal", 2: "emergency" } }
      - { space: discrete, addr: 0x0000, name: Normal_Available, metric: equipment_state, instance: Normal_Available }
      - { space: discrete, addr: 0x0001, name: Emergency_Available, metric: equipment_state, instance: Emergency_Available }
      - { space: discrete, addr: 0x0002, name: On_Emergency, metric: equipment_state, instance: On_Emergency }
