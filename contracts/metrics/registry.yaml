# Canonical metric registry.
#
# The dictionary that makes "canonical telemetry" mean something. Loaded into
# the `metric` table by migration, and code-generated into Go constants, Python
# definitions and TypeScript types. A metric key not in this file is a HARD
# validation failure in the collector, not a silently-passed string.
#
# Naming rules (docs/06-metric-registry.md section 1):
#   1. snake_case, no protocol names in the key
#   2. names WHAT is measured, never how it was read
#   3. ONE unit per key, forever - adapters convert
#   4. multi-instance uses `instance`, never a key suffix
#   5. counters and derived rates are SEPARATE keys
#   6. binary points end in _state or _alarm
#
# Fields:
#   aggregation   how a continuous aggregate rolls this up OVER TIME
#                 (spatial roll-up is an analytics decision, not this)
#   hot           mirrored into device_state.metrics for the rack/dashboard views
#   rate_of       this gauge is the derived rate of the named counter
#
# Phase 1 scope: universal, compute, network, environment. Power and cooling
# groups arrive with their adapters in phase 3.

version: 1

metrics:

  # ---------------------------------------------------------------- universal
  - key: sys_uptime
    display_name: System Uptime
    unit: s
    value_type: counter
    aggregation: last
    min_valid: 0
    stale_after_s: 300
    group: system
    device_types: []
    description: Agent uptime. A decrease means the agent restarted and all counters reset.

  - key: reachable
    display_name: Reachable
    unit: bool
    value_type: bool
    aggregation: last
    stale_after_s: 300
    hot: true
    group: system
    device_types: []
    description: Derived from endpoint communication state, not read from the device.

  - key: poll_latency
    display_name: Poll Latency
    unit: ms
    value_type: gauge
    aggregation: avg
    min_valid: 0
    max_valid: 60000
    stale_after_s: 300
    group: system
    device_types: []
    description: Collector-measured round trip for one poll of one endpoint.

  # ------------------------------------------------------------------ compute
  # alarm_scope: whether a condition on this metric belongs to the DEVICE or to
  # a part of it.
  #
  # It exists because `instance` had been carrying whatever a source chose to
  # call the reading rather than a sub-object anybody can point at: the same CPU
  # arrived as "" from a server's host MIB, "ALL" from a switch's Cisco CPU
  # table and nothing at all from a trap. The alarm key is
  # (device, alarm_type, instance), so one hot switch raised cpu_high twice -
  # MAJOR from the trap and WARNING from the rule, neither a duplicate of the
  # other as far as the key was concerned, both on the console.
  #
  # `device` files every alarm on the metric at the device, whatever the source
  # labelled the reading. `instance` - the default - keeps them apart, which is
  # right for a metric whose instances are real and separately actionable: one
  # interface, one rack inlet, one branch circuit. The default is that way round
  # because the two mistakes are not equal. A metric wrongly left per-instance
  # shows a duplicate on the console, which is visible and irritating; one
  # wrongly collapsed merges two genuine faults into a single alarm, and the
  # second fault is then invisible.
  - key: cpu_utilization
    display_name: CPU Utilization
    unit: pct
    value_type: gauge
    aggregation: avg
    min_valid: 0
    max_valid: 100
    stale_after_s: 120
    hot: true
    group: compute
    device_types: [server, switch, router, firewall, load_balancer]

    alarm_scope: device
  - key: cpu_temperature
    display_name: CPU Temperature
    unit: C
    value_type: gauge
    aggregation: max
    min_valid: -20
    max_valid: 130
    stale_after_s: 120
    hot: true
    group: thermal
    device_types: [server]
    description: Package temperature of a CPU socket. instance = socket id.

    alarm_scope: instance
  - key: memory_utilization
    display_name: Memory Utilization
    unit: pct
    value_type: gauge
    aggregation: avg
    min_valid: 0
    max_valid: 100
    stale_after_s: 120
    hot: true
    group: compute
    device_types: [server, switch, router, firewall, load_balancer]

    alarm_scope: device
  - key: memory_used
    display_name: Memory Used
    unit: B
    value_type: gauge
    aggregation: avg
    min_valid: 0
    stale_after_s: 120
    group: compute
    device_types: [server]

  - key: memory_total
    display_name: Memory Total
    unit: B
    value_type: gauge
    aggregation: last
    min_valid: 0
    stale_after_s: 3600
    group: compute
    device_types: [server]

  - key: memory_available
    display_name: Memory Available
    unit: B
    value_type: gauge
    aggregation: avg
    min_valid: 0
    stale_after_s: 120
    group: compute
    device_types: [server]
    description: UCD-SNMP memAvailReal. memory_used is derived from this and memory_total.

  - key: disk_utilization
    display_name: Disk Utilization
    unit: pct
    value_type: gauge
    aggregation: max
    min_valid: 0
    max_valid: 100
    stale_after_s: 300
    group: compute
    device_types: [server]
    description: instance = mount point or storage index.

  - key: disk_used
    display_name: Disk Used
    unit: B
    value_type: gauge
    aggregation: avg
    min_valid: 0
    stale_after_s: 300
    group: compute
    device_types: [server]

  - key: disk_total
    display_name: Disk Total
    unit: B
    value_type: gauge
    aggregation: last
    min_valid: 0
    stale_after_s: 3600
    group: compute
    device_types: [server]

  - key: inlet_temperature
    display_name: Inlet Temperature
    unit: C
    value_type: gauge
    aggregation: max
    min_valid: -20
    max_valid: 80
    stale_after_s: 120
    hot: true
    group: thermal
    device_types: [server, switch, router, sensor]

  - key: exhaust_temperature
    display_name: Exhaust Temperature
    unit: C
    value_type: gauge
    aggregation: max
    min_valid: -20
    max_valid: 100
    stale_after_s: 120
    group: thermal
    device_types: [server]

  - key: power_draw
    display_name: Power Draw
    unit: W
    value_type: gauge
    aggregation: avg
    min_valid: 0
    # 20 MW, not the 50 kW this carried while only servers reported it. The
    # same key now carries a utility feed and switchgear, and a real feed at
    # 166 kW was being flagged suspect against a server-scale ceiling.
    #
    # The bound still does its job. It exists to catch decode errors of orders
    # of magnitude - a word-order mistake multiplies by 65536, so even a 400 W
    # server misread that way lands at 26 MW and is still caught.
    max_valid: 20000000
    stale_after_s: 120
    hot: true
    group: power
    device_types: [server, switch, router, firewall, load_balancer, pdu, cdu,
                   crah, utility_feed, switchgear, mcc, mpp, generator, ups,
                   energy_monitor, chiller, pump, cooling_tower]

  - key: fan_speed
    display_name: Fan Speed
    unit: rpm
    value_type: gauge
    aggregation: avg
    min_valid: 0
    max_valid: 30000
    stale_after_s: 120
    group: thermal
    device_types: [server]
    description: instance = fan identifier from the BMC.

  - key: fan_speed_pct
    display_name: Fan Speed Percent
    unit: pct
    value_type: gauge
    aggregation: avg
    min_valid: 0
    max_valid: 100
    stale_after_s: 120
    group: thermal
    device_types: [server]

  - key: psu_input_voltage
    display_name: PSU Input Voltage
    unit: V
    value_type: gauge
    aggregation: avg
    min_valid: 0
    max_valid: 600
    stale_after_s: 120
    group: power
    device_types: [server]
    description: instance = PSU member id. 240 V on a wye feed, 208 V on a delta.

  - key: psu_output_power
    display_name: PSU Output Power
    unit: W
    value_type: gauge
    aggregation: avg
    min_valid: 0
    max_valid: 5000
    stale_after_s: 120
    group: power
    device_types: [server]

  - key: psu_state
    display_name: PSU State
    unit: bool
    value_type: bool
    aggregation: last
    stale_after_s: 300
    group: power
    device_types: [server]
    description: True when the BMC reports the supply Enabled and healthy.

  - key: energy_consumed
    display_name: Energy Consumed
    unit: kWh
    value_type: counter
    aggregation: last
    min_valid: 0
    stale_after_s: 600
    group: power
    device_types: [server, pdu]
    description: Cumulative energy. PUE is computed from this, never from an
      instantaneous power ratio.

  # ------------------------------------------------------------------ network
  - key: if_admin_state
    display_name: Interface Admin State
    unit: bool
    value_type: bool
    aggregation: last
    stale_after_s: 300
    group: interfaces
    device_types: [switch, router, server, firewall, load_balancer, oob_switch]

  - key: if_oper_state
    display_name: Interface Oper State
    unit: bool
    value_type: bool
    aggregation: last
    stale_after_s: 300
    hot: false
    group: interfaces
    device_types: [switch, router, server, firewall, load_balancer, oob_switch]
    description: instance = ifIndex. gNMI reports by name; normalise to ifIndex at ingest.

  - key: if_speed
    display_name: Interface Speed
    unit: bps
    value_type: gauge
    aggregation: last
    min_valid: 0
    stale_after_s: 3600
    group: interfaces
    device_types: [switch, router, server, firewall, load_balancer, oob_switch]

  - key: if_in_octets
    display_name: Interface In Octets
    unit: B
    value_type: counter
    aggregation: last
    min_valid: 0
    stale_after_s: 300
    group: interfaces
    device_types: [switch, router, server, firewall, load_balancer, oob_switch]

  - key: if_out_octets
    display_name: Interface Out Octets
    unit: B
    value_type: counter
    aggregation: last
    min_valid: 0
    stale_after_s: 300
    group: interfaces
    device_types: [switch, router, server, firewall, load_balancer, oob_switch]

  - key: if_in_bps
    display_name: Interface In Throughput
    unit: bps
    value_type: gauge
    aggregation: avg
    min_valid: 0
    stale_after_s: 300
    rate_of: if_in_octets
    rate_scale: 8
    group: interfaces
    device_types: [switch, router, server, firewall, load_balancer, oob_switch]
    description: Derived at ingest from if_in_octets. Octets/s x 8 = bits/s.

  - key: if_out_bps
    display_name: Interface Out Throughput
    unit: bps
    value_type: gauge
    aggregation: avg
    min_valid: 0
    stale_after_s: 300
    rate_of: if_out_octets
    rate_scale: 8
    group: interfaces
    device_types: [switch, router, server, firewall, load_balancer, oob_switch]

  - key: if_in_errors
    display_name: Interface In Errors
    unit: count
    value_type: counter
    aggregation: last
    min_valid: 0
    stale_after_s: 300
    group: interfaces
    device_types: [switch, router, server, firewall, load_balancer, oob_switch]

  - key: if_out_errors
    display_name: Interface Out Errors
    unit: count
    value_type: counter
    aggregation: last
    min_valid: 0
    stale_after_s: 300
    group: interfaces
    device_types: [switch, router, server, firewall, load_balancer, oob_switch]

  - key: if_in_discards
    display_name: Interface In Discards
    unit: count
    value_type: counter
    aggregation: last
    min_valid: 0
    stale_after_s: 300
    group: interfaces
    device_types: [switch, router, server, firewall, load_balancer, oob_switch]

  - key: if_out_discards
    display_name: Interface Out Discards
    unit: count
    value_type: counter
    aggregation: last
    min_valid: 0
    stale_after_s: 300
    group: interfaces
    device_types: [switch, router, server, firewall, load_balancer, oob_switch]

  - key: if_in_error_rate
    display_name: Interface In Error Rate
    unit: count_per_s
    value_type: gauge
    aggregation: avg
    min_valid: 0
    stale_after_s: 300
    rate_of: if_in_errors
    group: interfaces
    device_types: [switch, router, server, firewall, load_balancer, oob_switch]

  # -------------------------------------------------------------- environment
  - key: ambient_temperature
    display_name: Ambient Temperature
    unit: C
    value_type: gauge
    aggregation: max
    min_valid: -40
    max_valid: 90
    stale_after_s: 120
    hot: true
    group: environment
    device_types: [sensor]

  - key: relative_humidity
    display_name: Relative Humidity
    unit: pct
    value_type: gauge
    aggregation: avg
    min_valid: 0
    max_valid: 100
    stale_after_s: 120
    hot: true
    group: environment
    device_types: [sensor]

  - key: dew_point
    display_name: Dew Point
    unit: C
    value_type: gauge
    aggregation: avg
    min_valid: -40
    max_valid: 60
    stale_after_s: 120
    group: environment
    device_types: [sensor]

  - key: airflow
    display_name: Airflow
    unit: pct
    value_type: gauge
    aggregation: avg
    min_valid: 0
    max_valid: 100
    stale_after_s: 120
    group: environment
    device_types: [sensor, crah]

  # ------------------------------------------------------------------ cooling
  #
  # Arrives with the BACnet adapter (phase 3.3). Hydronic points carry the LOOP
  # in `instance` - CHW, COND, TCS - rather than exploding into a key per loop:
  # a chiller measures supply temperature on two loops at once, and one key
  # with an instance is how the same physical quantity stays comparable across
  # chillers, pumps and CDUs.

  - key: water_supply_temp
    display_name: Water Supply Temperature
    unit: C
    value_type: gauge
    aggregation: avg
    min_valid: -20
    max_valid: 120
    stale_after_s: 300
    hot: true
    group: cooling
    device_types: [chiller, cdu, crah, pump]
    description: Leaving water temperature. instance names the loop (CHW, COND, TCS).

  - key: water_return_temp
    display_name: Water Return Temperature
    unit: C
    value_type: gauge
    aggregation: avg
    min_valid: -20
    max_valid: 120
    stale_after_s: 300
    group: cooling
    device_types: [chiller, cdu, crah, pump]
    description: Entering water temperature. instance names the loop.

  - key: water_setpoint_temp
    display_name: Water Setpoint
    unit: C
    value_type: gauge
    aggregation: last
    min_valid: -20
    max_valid: 120
    stale_after_s: 900
    group: cooling
    device_types: [chiller, cdu]
    description: Commanded leaving-water temperature. A persistent gap against water_supply_temp is the plant losing capacity.

  - key: water_flow
    display_name: Water Flow
    unit: L/s
    value_type: gauge
    aggregation: avg
    min_valid: 0
    stale_after_s: 300
    group: cooling
    device_types: [chiller, cdu, pump, cooling_tower]
    description: Volumetric flow. instance names the loop.

  - key: water_pressure
    display_name: Water Pressure
    unit: kPa
    value_type: gauge
    aggregation: avg
    min_valid: 0
    stale_after_s: 300
    group: cooling
    device_types: [chiller, cdu, pump]
    description: Gauge pressure. instance names the tap (EVAP, COND, DISCHARGE, SUCTION, TCS).

  - key: water_diff_pressure
    display_name: Differential Pressure
    unit: kPa
    value_type: gauge
    aggregation: avg
    stale_after_s: 300
    group: cooling
    device_types: [pump, cdu]
    description: Pressure across a pump or a filter. instance names the element.

  - key: valve_position_pct
    display_name: Valve Position
    unit: pct
    value_type: gauge
    aggregation: avg
    min_valid: 0
    max_valid: 100
    stale_after_s: 300
    group: cooling
    device_types: [valve, crah, cdu]
    description: Commanded or measured opening. instance names the valve when a device has more than one.

  - key: compressor_load_pct
    display_name: Compressor Load
    unit: pct
    value_type: gauge
    aggregation: avg
    min_valid: 0
    max_valid: 100
    stale_after_s: 300
    hot: true
    group: cooling
    device_types: [chiller]
    description: Percentage of full load. Sustained 100 percent with a rising supply temperature is a chiller that has run out of capacity.

  - key: cooling_capacity
    display_name: Cooling Capacity
    unit: W
    value_type: gauge
    aggregation: avg
    min_valid: 0
    stale_after_s: 300
    group: cooling
    device_types: [chiller]
    description: Thermal capacity delivered, in watts. The percentage form is a separate key, cooling_output_pct.

  - key: cooling_output_pct
    display_name: Cooling Output
    unit: pct
    value_type: gauge
    aggregation: avg
    min_valid: 0
    max_valid: 100
    stale_after_s: 300
    group: cooling
    device_types: [crah]
    description: Percentage of rated capacity in use. Separate from cooling_capacity because one key may carry only one unit.

  - key: thermal_load
    display_name: Thermal Load
    unit: W
    value_type: gauge
    aggregation: avg
    min_valid: 0
    stale_after_s: 300
    group: cooling
    device_types: [cdu]
    description: Heat rejected into the facility loop. Not electrical draw, which is power_draw.

  - key: cop
    display_name: Coefficient of Performance
    unit: ratio
    value_type: gauge
    aggregation: avg
    min_valid: 0
    max_valid: 20
    stale_after_s: 300
    group: cooling
    device_types: [chiller]
    description: Cooling delivered per unit of electrical input.

  - key: approach_temp
    display_name: Approach Temperature
    unit: K
    value_type: gauge
    aggregation: avg
    stale_after_s: 300
    group: cooling
    device_types: [cdu, cooling_tower]
    description: A temperature DIFFERENCE in kelvin, not a temperature in celsius. A widening approach is the standard fouling signature.

  - key: supply_air_temp
    display_name: Supply Air Temperature
    unit: C
    value_type: gauge
    aggregation: avg
    min_valid: -20
    max_valid: 80
    stale_after_s: 300
    hot: true
    group: cooling
    device_types: [crah]
    description: Discharge air. A high discharge means the unit has lost the ability to cool.

  - key: return_air_temp
    display_name: Return Air Temperature
    unit: C
    value_type: gauge
    aggregation: avg
    min_valid: -20
    max_valid: 80
    stale_after_s: 300
    group: cooling
    device_types: [crah]
    description: Entering air. A high return means the unit is holding setpoint and the hot aisle feeding it is too hot - a load symptom, not a unit fault.

  - key: air_setpoint_temp
    display_name: Air Setpoint
    unit: C
    value_type: gauge
    aggregation: last
    min_valid: -20
    max_valid: 80
    stale_after_s: 900
    group: cooling
    device_types: [crah]
    description: Commanded supply-air temperature.

  - key: filter_diff_pressure
    display_name: Filter Differential Pressure
    unit: kPa
    value_type: gauge
    aggregation: avg
    min_valid: 0
    stale_after_s: 600
    group: cooling
    device_types: [cdu, crah]
    description: Pressure drop across the filter. Rising over weeks is the maintenance signal.

  - key: basin_level_pct
    display_name: Basin Level
    unit: pct
    value_type: gauge
    aggregation: avg
    min_valid: 0
    max_valid: 100
    stale_after_s: 600
    group: cooling
    device_types: [cooling_tower]
    description: Cooling-tower basin water level.

  - key: makeup_water_flow
    display_name: Makeup Water Flow
    unit: L/s
    value_type: gauge
    aggregation: avg
    min_valid: 0
    stale_after_s: 600
    group: cooling
    device_types: [cooling_tower]
    description: Makeup water into the basin. Devices commonly report litres per minute; adapters convert.

  # Outdoor air. Kept as its own keys rather than reusing ambient_temperature:
  # that key is an INDOOR room sensor, and rolling both into one would let a
  # January night outside pull a data hall's average inlet down with it.
  #
  # Read from the cooling-tower controller, which is where a BMS keeps them - a
  # tower is controlled to approach wet bulb, so the outdoor sensor is wired to
  # it. Aggregation is avg, not max: this is a condition the site is subject to,
  # not a hot spot to find.
  - key: outdoor_dry_bulb_temp
    display_name: Outdoor Dry Bulb
    unit: C
    value_type: gauge
    aggregation: avg
    min_valid: -60
    max_valid: 60
    stale_after_s: 900
    group: environment
    device_types: [cooling_tower]
    description: Outdoor air temperature at the site. Drives economiser hours and chiller lift.

  - key: outdoor_wet_bulb_temp
    display_name: Outdoor Wet Bulb
    unit: C
    value_type: gauge
    aggregation: avg
    min_valid: -60
    max_valid: 45
    stale_after_s: 900
    group: environment
    device_types: [cooling_tower]
    description: Outdoor wet-bulb temperature. Sets the cooling tower's approach limit, so it decides whether the plant can hold its condenser setpoint. Never above dry bulb.

  - key: vibration
    display_name: Vibration
    unit: mm/s
    value_type: gauge
    aggregation: avg
    min_valid: 0
    stale_after_s: 600
    group: cooling
    device_types: [cooling_tower, pump]
    description: RMS velocity. The leading indicator of bearing wear.

  - key: motor_temp
    display_name: Motor Temperature
    unit: C
    value_type: gauge
    aggregation: avg
    min_valid: -20
    max_valid: 200
    stale_after_s: 300
    group: cooling
    device_types: [pump, valve]
    description: Motor or actuator winding temperature.

  - key: vfd_frequency
    display_name: VFD Output Frequency
    unit: Hz
    value_type: gauge
    aggregation: avg
    min_valid: 0
    max_valid: 200
    stale_after_s: 300
    group: cooling
    device_types: [pump]
    description: Drive output frequency. Read with pump_speed_pct it separates a commanded slow-down from a drive fault.

  - key: pump_speed_pct
    display_name: Pump Speed
    unit: pct
    value_type: gauge
    aggregation: avg
    min_valid: 0
    max_valid: 100
    stale_after_s: 300
    group: cooling
    device_types: [pump, cdu]
    description: Commanded speed as a percentage.

  - key: run_hours
    display_name: Run Hours
    unit: h
    value_type: counter
    aggregation: last
    min_valid: 0
    stale_after_s: 3600
    group: cooling
    device_types: [chiller, pump, cooling_tower, cdu, crah]
    description: Lifetime running hours. A counter that stops advancing on a machine reporting itself as running is the machine lying.

  - key: equipment_state
    display_name: Equipment State
    unit: bool
    value_type: bool
    aggregation: last
    stale_after_s: 300
    hot: true
    group: cooling
    device_types: [chiller, pump, cooling_tower, cdu, crah, valve]
    description: Running or stopped. instance carries the point name, so a device with several status points keeps them distinct.

  - key: alarm_state
    display_name: Alarm State
    unit: bool
    value_type: bool
    aggregation: max
    stale_after_s: 300
    hot: true
    group: cooling
    device_types: [chiller, pump, cooling_tower, cdu, crah, valve, energy_monitor]
    description: One alarm point. instance carries the vendor alarm name - a key per vendor alarm would make the registry unmaintainable and the UI incomparable across makes.

  # -------------------------------------------------------------------- power
  #
  # Arrives with the BACnet and Modbus adapters. Phase and branch-circuit
  # multiplicity is carried in instance (A/B/C, Ckt01..Ckt42).

  - key: voltage_ln
    display_name: Line-to-Neutral Voltage
    unit: V
    value_type: gauge
    aggregation: avg
    min_valid: 0
    max_valid: 600
    stale_after_s: 300
    group: power
    device_types: [energy_monitor, pdu, rpp, ups]
    description: Phase-to-neutral voltage. instance is the phase.

  - key: current
    display_name: Current
    unit: A
    value_type: gauge
    aggregation: avg
    min_valid: 0
    stale_after_s: 300
    hot: true
    group: power
    device_types: [energy_monitor, pdu, rpp, ups]
    description: RMS current. instance is the phase or the branch circuit.

  - key: line_frequency
    display_name: Line Frequency
    unit: Hz
    value_type: gauge
    aggregation: avg
    min_valid: 0
    max_valid: 100
    stale_after_s: 300
    group: power
    device_types: [energy_monitor, pdu, ups, generator]
    description: Mains frequency.

  - key: power_factor
    display_name: Power Factor
    unit: ratio
    value_type: gauge
    aggregation: avg
    min_valid: 0
    max_valid: 1
    stale_after_s: 300
    group: power
    device_types: [energy_monitor, pdu, rpp]
    description: True power factor. instance is the phase or circuit.

  - key: voltage_thd_pct
    display_name: Voltage THD
    unit: pct
    value_type: gauge
    aggregation: avg
    min_valid: 0
    stale_after_s: 600
    group: power
    device_types: [energy_monitor]
    description: Total harmonic distortion of the voltage waveform. The IEEE-519 quantity, and the one a power-quality alarm is written against.

  - key: current_thd_pct
    display_name: Current THD
    unit: pct
    value_type: gauge
    aggregation: avg
    min_valid: 0
    stale_after_s: 600
    group: power
    device_types: [energy_monitor]
    description: Total harmonic distortion of the current waveform. Naturally high at light load, so a diagnostic rather than an alarm source.

  - key: harmonic_current_pct
    display_name: Harmonic Current
    unit: pct
    value_type: gauge
    aggregation: avg
    min_valid: 0
    stale_after_s: 600
    group: power
    device_types: [energy_monitor]
    description: One harmonic order as a percentage of the fundamental. instance is the order (3, 5, 7, 9).

  # ------------------------------------------------- power (Modbus, phase 3.5)
  #
  # Electrical switchgear, meters, gensets, transfer switches and UPS. Phase
  # multiplicity stays in instance (A/B/C); so does the SOURCE on gear that
  # measures more than one (NORMAL/EMERGENCY on a transfer switch,
  # INPUT/OUTPUT on a UPS).

  - key: voltage_ll
    display_name: Line-to-Line Voltage
    unit: V
    value_type: gauge
    aggregation: avg
    min_valid: 0
    max_valid: 1000
    stale_after_s: 300
    hot: true
    group: power
    device_types: [utility_feed, switchgear, mcc, mpp, ats, ups, generator]
    description: Phase-to-phase voltage. instance names the source when a device measures more than one (NORMAL, EMERGENCY, INPUT).

  - key: reactive_power
    display_name: Reactive Power
    unit: VAR
    value_type: gauge
    aggregation: avg
    stale_after_s: 300
    group: power
    device_types: [utility_feed, switchgear, mcc, mpp]
    description: Signed, because reactive power has a direction. Watts and VAR are separate keys, never one key with a units column.

  - key: apparent_power
    display_name: Apparent Power
    unit: VA
    value_type: gauge
    aggregation: avg
    min_valid: 0
    stale_after_s: 300
    group: power
    device_types: [utility_feed, switchgear, mcc, mpp]
    description: Apparent power. With power_draw it gives the power factor a meter may not publish directly.

  - key: load_pct
    display_name: Load
    unit: pct
    value_type: gauge
    aggregation: avg
    min_valid: 0
    stale_after_s: 300
    hot: true
    group: power
    device_types: [switchgear, mcc, mpp, generator, ups]
    description: Load as a percentage of the device rating. The number capacity planning is actually written against, and the device knows its own nameplate where the DCIM may not.

  - key: phase_imbalance_pct
    display_name: Voltage Imbalance
    unit: pct
    value_type: gauge
    aggregation: max
    min_valid: 0
    stale_after_s: 300
    group: power
    device_types: [utility_feed, switchgear, mcc, mpp]
    description: Spread between phase voltages. Sustained imbalance above about 2 percent overheats three-phase motors, so it is an alarm source rather than a curiosity.

  - key: demand_peak_power
    display_name: Peak Demand
    unit: W
    value_type: gauge
    aggregation: max
    min_valid: 0
    stale_after_s: 900
    group: power
    device_types: [utility_feed]
    description: Peak demand held by the meter. Billing uses it, so it is read from the meter rather than recomputed from samples the collector may have missed.

  - key: battery_runtime
    display_name: Battery Runtime
    unit: s
    value_type: gauge
    aggregation: min
    min_valid: 0
    stale_after_s: 300
    hot: true
    group: power
    device_types: [ups]
    description: Estimated runtime left on battery. Seconds, because one unit per key - devices publish minutes and adapters convert.

  - key: battery_health_pct
    display_name: Battery Health
    unit: pct
    value_type: gauge
    aggregation: min
    min_valid: 0
    max_valid: 100
    stale_after_s: 900
    group: power
    device_types: [ups]
    description: Remaining battery capacity against nameplate. Degrades over years, so it trends rather than alarms.

  - key: fuel_level_pct
    display_name: Fuel Level
    unit: pct
    value_type: gauge
    aggregation: min
    min_valid: 0
    max_valid: 100
    stale_after_s: 900
    hot: true
    group: power
    device_types: [generator]
    description: Day-tank level. Read with run time it answers the only question that matters during an outage - how long the generator can keep going.

  - key: current_run_time
    display_name: Current Run Time
    unit: s
    value_type: gauge
    aggregation: last
    min_valid: 0
    stale_after_s: 300
    group: power
    device_types: [generator]
    description: Duration of the CURRENT run, which resets to zero on each start. A gauge, not a counter - see run_hours for the lifetime accumulator.

  - key: start_attempts
    display_name: Start Attempts
    unit: count
    value_type: counter
    aggregation: last
    min_valid: 0
    stale_after_s: 3600
    group: power
    device_types: [generator]
    description: Lifetime start attempts. Rising without run_hours rising is a genset that is failing to start.

  - key: transfer_count
    display_name: Transfer Count
    unit: count
    value_type: counter
    aggregation: last
    min_valid: 0
    stale_after_s: 3600
    group: power
    device_types: [ats]
    description: Lifetime transfers. Each one is a mechanical operation with a finite life, so it is a maintenance signal as well as an event count.

  - key: time_on_emergency
    display_name: Time on Emergency
    unit: s
    value_type: counter
    aggregation: last
    min_valid: 0
    stale_after_s: 3600
    group: power
    device_types: [ats]
    description: Lifetime seconds fed from the emergency source.

  - key: operating_mode
    display_name: Operating Mode
    unit: text
    value_type: text
    aggregation: last
    stale_after_s: 300
    hot: true
    group: power
    device_types: [ups, ats, generator]
    description: The device's own state word - online/battery/bypass, normal/emergency, standby/running/cranking. Text rather than a set of booleans because these states are mutually exclusive and the device already publishes exactly one.

  # ---------------------------------------------------- platform (gNMI, 3.6)

  - key: component_temperature
    display_name: Component Temperature
    unit: C
    value_type: gauge
    aggregation: avg
    min_valid: -20
    max_valid: 150
    stale_after_s: 300
    group: thermal
    device_types: [switch, router, firewall, load_balancer, oob_switch]
    description: >-
      A temperature sensor on a named hardware component, from
      openconfig-platform. instance is the component (CHASSIS, LINECARD, a
      transceiver). A CPU component maps to cpu_temperature instead, because
      that is the same physical quantity a server reports and splitting it by
      protocol would make the fleet impossible to chart in one view.
