# Collector process configuration.
#
# Note what is ABSENT: any device. The DCIM database is the source of truth for
# what exists and this process pulls its work list from
# /api/v1/collector/assignments. A file-based device list goes stale within
# minutes of a fleet change.

collector:
  id: col-1

dcim:
  base_url: http://127.0.0.1:8000
  # The token is read from this environment variable. Never put a literal
  # secret in this file.
  token_env: DCIM_COLLECTOR_TOKEN
  assignment_path: /api/v1/collector/assignments
  assignment_interval: 30s
  request_timeout: 15s

redis:
  url_env: DCIM_REDIS_URL
  # 127.0.0.1, not localhost: on Windows localhost prefers ::1 and a
  # Docker-published port answers there unreliably.
  url: redis://127.0.0.1:6379/0
  streams:
    telemetry:     {name: telemetry.v1,     maxlen: 2000000}
    events:        {name: events.v1,        maxlen: 500000}
    endpointstate: {name: endpointstate.v1, maxlen: 200000}
    heartbeat:     {name: collectorhb.v1,   maxlen: 10000}

publisher:
  max_batch: 500
  max_delay: 200ms
  # Bounded fallback when Redis is unreachable. Telemetry is shed from the
  # oldest end; events are never shed.
  ring_capacity: 50000

workers:
  pool_size: 128
  queue_multiplier: 8

protocols:
  snmp:
    enabled: true
    # Tuned for a single snmpsim process serving the whole fleet from one
    # wildcard socket. Each server poll is ~20 SNMP operations (one GET plus a
    # BulkWalk per table column), so 894 endpoints is ~18k operations a cycle;
    # 256 in flight simply queues behind one responder and everything times
    # out. Real gear answers per-device and tolerates far more fan-out.
    max_concurrent: 48
    # Per HOST, not per endpoint: a server has two SNMP agents and a gateway
    # fronts several field devices.
    per_host: 2
    timeout: 6s
    retries: 2
    # An agent bound to a wildcard socket replies from whichever source
    # address the kernel picks, not necessarily the one polled. gosnmp's
    # connected UDP socket drops those replies and every poll times out.
    accept_any_source_reply: true
    max_repetitions: 25

  redfish:
    enabled: true
    # HTTPS per BMC: the handshake, not the payload, is the cost. Connections
    # are pooled and kept alive, and one request at a time per host because a
    # BMC serialises them regardless.
    max_concurrent: 32
    per_host: 1
    timeout: 8s
    retries: 1

  # Pushed Redfish events. Off by default because `advertise` has no safe
  # default - see below.
  redfish_event:
    enabled: false
    listen: "0.0.0.0:9143"
    # host:port the BMCs are told to POST to. REQUIRED, and it must be an
    # address reachable FROM the management network. The collector cannot work
    # this out itself: on a multi-homed host a wrong guess creates the
    # subscriptions successfully and then delivers nothing, with no error at
    # either end.
    advertise: ""
    # TLS on the DESTINATION url, not on the listener. Leave it off unless the
    # BMCs trust the receiver's certificate: firmware that cannot verify it
    # drops every event silently. The simulator posts with urllib, which
    # verifies by default, so a self-signed https destination loses everything.
    tls: false
    workers: 4
    rate_limit_per_minute: 120
    # Subscriptions are reconciled, not created once. A BMC reset drops every
    # subscription silently, and orphans pointing at a previous collector
    # address accumulate until the per-BMC cap (often 8-20) is reached, after
    # which new subscriptions fail and events simply stop.
    reconcile_every: 10m

  snmp_trap:
    enabled: true
    # 1162, not the well-known 162, because binding below 1024 needs root or
    # CAP_NET_BIND_SERVICE and the collector should not run privileged just to
    # receive traps. In production grant the capability and use 162:
    #   sudo setcap 'cap_net_bind_service=+ep' ./bin/collector
    #
    # Whichever port is used, the device plane must be TOLD about it - the
    # simulator defaults to 127.0.0.1:162 and points nowhere useful otherwise:
    #   POST /api/snmp/trap-receiver {"ip": "<collector>", "port": 1162}
    # Without that step no trap arrives and the alarm path looks broken when it
    # is merely unaddressed.
    listen: "0.0.0.0:1162"
    workers: 8
    # Per source. A flapping interface must not fill the stream or the disk.
    rate_limit_per_minute: 100

health:
  # One failure is DEGRADED. OFFLINE needs this many consecutive failures AND
  # more than two intervals since the last success.
  offline_threshold: 3

mappings:
  dir: ../contracts/mappings

observability:
  log_level: info
  log_format: json
  metrics_listen: "0.0.0.0:9100"
  health_listen: "0.0.0.0:9101"
  heartbeat_every: 10s

limits:
  # One socket per Redfish BMC and per gNMI stream; fd exhaustion is the real
  # scaling wall, not CPU.
  max_open_files: 65536
