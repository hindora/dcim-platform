[project]
name = "dcim-backend"
version = "0.1.0"
description = "DCIM platform backend: REST/WebSocket API, ingest worker, migrations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "msgpack>=1.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "PyJWT>=2.8",
    "passlib[bcrypt]>=1.7",
    "prometheus-client>=0.20",
    "PyYAML>=6.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]   # FastAPI Depends() in defaults is the documented idiom

[tool.ruff.lint.per-file-ignores]
"app/contracts/messages_gen.py" = ["ALL"]
"app/core/metrics_gen.py" = ["ALL"]
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["app/contracts/messages_gen.py", "app/core/metrics_gen.py"]
